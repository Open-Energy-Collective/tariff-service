name: CI
# Pull requests into main. The main ruleset requires the job named `test`. No AWS credentials:
# deploy-check lints and builds the SAM template locally.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Build SQLite from seed
        run: python seed/build_db.py
  deploy-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
      - name: Install dependencies
        run: pip install -e .
      - name: Build SQLite
        run: python seed/build_db.py
      - name: SAM Validate (lint, no credentials)
        run: sam validate --lint --template-file infra/template.yaml --region ap-southeast-2
      - name: SAM Build
        run: sam build --template-file infra/template.yaml
